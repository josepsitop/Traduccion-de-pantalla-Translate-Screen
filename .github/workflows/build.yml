name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Por si el archivo release.jks no se subió: se crea uno nuevo.
      - name: Keystore de respaldo
        run: |
          if [ ! -f app/release.jks ]; then
            keytool -genkeypair -keystore app/release.jks -storetype PKCS12 \
              -storepass bubblelens -keypass bubblelens -alias bubblelens \
              -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=BubbleLens"
          fi

      - name: Compilar APK (release optimizado)
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: BubbleLens-APK
          path: app/build/outputs/apk/release/*.apk
