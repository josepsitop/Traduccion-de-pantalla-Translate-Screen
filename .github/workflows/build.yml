name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Keystore de respaldo
        run: |
          if [ ! -f app/release.jks ]; then
            keytool -genkeypair -keystore app/release.jks -storetype PKCS12 \
              -storepass bubblelens -keypass bubblelens -alias bubblelens \
              -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=BubbleLens"
          fi

      - name: Compilar (optimizado)
        id: opt
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --console=plain 2>&1 | tee build1.log

      - name: Causa del error (optimizado)
        if: steps.opt.outcome == 'failure'
        run: |
          grep -nE "^e: |What went wrong|Missing class|ERROR|error:|Execution failed|Could not|licen" -A6 build1.log | head -70 || true

      - name: Compilar (plan B, sin optimizar)
        if: steps.opt.outcome == 'failure'
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --console=plain -Pnominify 2>&1 | tee build2.log

      - name: Causa del error (plan B)
        if: failure()
        run: |
          grep -nE "^e: |What went wrong|Missing class|ERROR|error:|Execution failed|Could not|licen" -A6 build2.log | head -70 || true

      - uses: actions/upload-artifact@v4
        with:
          name: BubbleLens-APK
          path: app/build/outputs/apk/release/*.apk
